# CI — quality gate on every PR + push to main.
# Mirrors the local verification convention (tsc + lint + jest before "done").
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The app reads only this env var; mock keeps CI hermetic (no backend).
      EXPO_PUBLIC_API_MODE: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint -- --max-warnings 0

      - name: Test
        run: npx jest --ci
